spring.application.name=GameManager

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/gamemanager
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Configuration (Optional but recommended to be explicit)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# RAWG API (Unchanged)
rawg.api.key=0c55c916900843dd906421bbeee28588
rawg.api.base-url=https://api.rawg.io/api